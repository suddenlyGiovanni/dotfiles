- defaults:
    link:
      relink: true
      create: true
    shell:
      stdout: true
      stderr: true

- clean: ["~"]

- link:
    # Bash
#      ~/.bashrc: bash/bashrc

    # Zsh
    ~/.zshrc: zsh/zshrc
    ~/.zshenv: zsh/zshenv

    # Fish
    ~/.config/fish:
      path: fish
      force: true
    # Nix
    ~/.config/nix:
      path: nix
      create: true
      force: true

    ~/.config/nix-darwin:
      path: nix-darwin
      create: true
      force: true


    # Git
    ~/.gitconfig: git/gitconfig
    ~/.gitconfig.user: git/gitconfig.user
    ~/.gitignore: git/gitignore
    ~/.config/git/.gitmessage: git/gitmessage

    # gh
    ~/.config/gh:
      glob: true
      path: gh/*
      force: true
      exclude: [gh/hosts.yml]

    # Bat
    ~/.config/bat:
      path: bat

    # Starship Shell Prompt
    ~/.config/starship.toml: starship/starship.toml


    # Editor config
    ~/.editorconfig:

    # Fonts:


- create:
    - ~/.config
    - ~/repos

- shell: 
#    - command: ./scripts/install_homebrew.sh
#    - command: ./scripts/setup_homebrew.sh
#    - command: ./scripts/setup_fish.sh

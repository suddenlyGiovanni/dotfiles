- defaults:
      link:
          relink: true
          create: true

- clean: ["~"]

- link:
      # Bash
      ~/.bashrc: bash/bashrc

      # Zsh
      ~/.zshrc: zsh/zshrc
      ~/.zshenv: zsh/zshenv

      # Git
      ~/.gitconfig: git/gitconfig

      # gh
      ~/.config/gh:
          glob: true
          path: gh/*
          exclude: [gh/hosts.yml]
          relink: true

      # Bat
      ~/.config/bat:
          create: true
          path: config/bat

      # Fish
      ~/.config/fish/config.fish: fish/config.fish
      ~/.config/fish/fish_plugins: fish/fish_plugins
      ~/.config/fish/fish_variables: fish/fish_variables
      ~/.config/fish/conf.d:
          path: fish/conf.d/*.fish
          glob: true
      ~/.config/fish/functions:
          path: fish/functions/*.fish
          glob: true
          create: true
      ~/.config/fish/completions:
          path: fish/completions/*.fish
          glob: true
          create: true

      # Starship Shell Prompt
      ~/.config/starship.toml: starship/starship.toml

      # Iterm2
      ~/.config/iterm2:
          create: true
          path: config/iterm2

- create:
      - ~/Projects
      - ~/.config

- shell:
      - command: ./setup_homebrew.zsh
        stdout: true
        stderr: true

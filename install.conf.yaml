- defaults:
    link:
      relink: true
      create: true

- clean: ["~"]

- link:
    # Bash
    ~/.bashrc: bash/bashrc

    # Zsh
    ~/.zshrc: zsh/zshrc
    ~/.zshenv: zsh/zshenv

    # Fish
    ~/.config/fish:
      path: fish
      relink: true

    # Git
    ~/.gitconfig: git/gitconfig

    # gh
    ~/.config/gh:
      glob: true
      path: gh/*
      exclude: [gh/hosts.yml]
      relink: true

    # Bat
    ~/.config/bat:
      create: true
      path: bat

    # Starship Shell Prompt
    ~/.config/starship.toml: starship/starship.toml

    # The fuck
    ~/.config/thefuck: thefuck

    # Iterm2
    ~/com.googlecode.iterm2.plist: iterm2/com.googlecode.iterm2.plist

    # Iterm2 Automatic theme switcher
    ~/Library/Application Support/iTerm2/Scripts/AutoLaunch/switch_automatic.py:
      path: iterm2/switch_automatic.py
      create: true
      relink: true

    # Iterm2 Shell integration
    ~/.iterm2_shell_integration.fish:
      path: iterm2/iterm2_shell_integration

    # Editor config
    ~/.editorconfig:

- create:
    - ~/Projects
    - ~/.config

- shell:
    - command: ./scripts/setup_homebrew.sh
      stdout: true
      stderr: true
    - command: ./scripts/setup_fish.sh
      stdout: true
      stderr: true

- defaults:
      link:
          relink: true

- clean: ["~"]

- link:
      # Bash
      ~/.bashrc:

      # Zsh
      ~/.zshrc: zsh/zshrc
      ~/.zshenv: zsh/zshenv

      # Git
      ~/.gitconfig:

      # Bat
      ~/.config/bat:
          create: true
          path: config/bat

      # Fish
      ~/.config/fish:
          create: true
          path: config/fish
      ~/.config/fish/functions:
          path: fish/functions/*.fish
          glob: true
          create: true
      ~/.config/fish/completions:
          path: fish/completions/*.fish
          glob: true
          create: true

      # Starship Shell Prompt
      ~/.config/starship.toml: config/starship.toml

      # Iterm2
      ~/.config/iterm2:
          create: true
          path: config/iterm2

- create:
      - ~/Projects
      - ~/.config

- shell:
      - command: ./setup_homebrew.zsh
        stdout: true
        stderr: true

- defaults:
      link:
          relink: true

- clean: ["~"]

- link:
      ~/.zshrc:
      ~/.zshenv:
      ~/.gitconfig:
      ~/.config/bat:
          create: true
          path: config/bat
      ~/.config/fish:
          create: true
          path: config/fish

- create:
      - ~/Projects

- shell:
      - command: ./setup_homebrew.zsh
        stdout: true
        stderr: true
